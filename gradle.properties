org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Gradle 9.x's configuration cache isn't fully supported by Kotlin Gradle
# plugin 1.9.24 yet (see the checkReleaseAarMetadata / task-completion-
# listener errors this fixes). Configuration cache is a build-speed
# optimization only -- disabling it doesn't affect correctness or the
# built APK, just makes `assembleRelease` a little slower to configure.
org.gradle.configuration-cache=false

# AGP 9.0+ compiles Kotlin itself by default and errors if the separate
# org.jetbrains.kotlin.android plugin is also applied (which this project
# does, in build.gradle.kts). This flag opts back out, keeping the existing
# plugin structure working unchanged. Google documents this as a TEMPORARY
# escape hatch, removed starting AGP 10.0 -- if a future AGP bump breaks
# the build again, this line is the first thing to reconsider (the real
# fix at that point is removing the kotlin.android plugin application and
# adopting AGP's built-in Kotlin fully, not re-adding this flag).
android.builtInKotlin=false

# Separate from builtInKotlin above: AGP 9 also defaults to a new DSL type
# for the `android {}` extension (ApplicationExtensionImpl, interface-based)
# instead of the old BaseExtension-derived class. KSP's Gradle plugin (and
# potentially kotlin-android at this version) still internally casts to
# BaseExtension, which throws a ClassCastException under the new type.
# Same deal as builtInKotlin: documented as temporary, removed in AGP 10.0.
android.newDsl=false
